# Local backend for development. The Angular frontend is served separately
# with `ng serve` (see README) and proxies /api and /install to this stack.
services:
  web:
    build:
      context: ./docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
    environment:
      # Only used to prefill the web installer form during development.
      INSTALLER_DB_HOST: db
      INSTALLER_DB_NAME: dungeon
      INSTALLER_DB_USER: dungeon
      INSTALLER_DB_PASS: dungeon
      INSTALLER_DEV_DEFAULTS: "1"
    depends_on:
      - db

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: dungeon
      MYSQL_USER: dungeon
      MYSQL_PASSWORD: dungeon
    volumes:
      - dbdata:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:5
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db

volumes:
  dbdata:
